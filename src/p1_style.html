<title>ASTRAEUS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cinematic dark navy field, thin silver instrument lines, products on quiet panels; cart and checkout flip to warm white. Single committed theme. */
:root{
  --navy:#01274E; --navy-deep:#011A36; --navy-ink:#021331;
  --blue:#0E73B3; --blue-soft:#2C8FD0;
  --silver:#ADAEB1; --silver-dim:#6F7C8C; --line:rgba(173,174,177,.28); --line-soft:rgba(173,174,177,.14);
  --white:#FBFAFB; --fg:#FBFAFB; --fg-dim:#B9C2CE;
  --slate:#3F5570; --steel:#8E9AA8;
  --panel:rgba(1,26,54,.72); --panel-solid:#032047;
  --display:"Saira","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:4px; --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--navy-ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,6vw,72px);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:clamp(24px,3.4vw,40px);text-transform:uppercase;letter-spacing:.06em}
h3{font-size:clamp(18px,2vw,24px)}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver)}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-dim)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}

/* star canvas */
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(14,115,179,.18),transparent 60%)}

.gatep{min-height:100vh;display:grid;place-items:center;padding:40px var(--gutter);position:relative}
.gatemark{display:grid;justify-items:center;gap:0;animation:gatein 1.4s ease both}
@keyframes gatein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.gatemark .logo{width:min(32vw,150px);height:min(32vw,150px)}
.gatemark .word{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.6vw,48px);letter-spacing:.42em;padding-left:.42em;margin-top:24px}
.gatemark .enterbtn{margin-top:40px;min-width:200px;letter-spacing:.3em}

/* intro page */
.introp{min-height:100vh;display:grid;place-items:center;position:relative;padding:40px var(--gutter)}
.introp .mark{display:grid;justify-items:center;gap:22px;opacity:0;transform:scale(.94);transition:opacity 2.2s ease,transform 2.2s ease}
.introp .mark.on{opacity:1;transform:none}
.introp .mark .logo{width:min(40vw,200px);height:min(40vw,200px)}
.introp .word{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,54px);letter-spacing:.42em;padding-left:.42em;opacity:0;transition:opacity 1.2s ease .7s}
.introp .mark.on .word{opacity:1}
.introp .sub{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--silver);opacity:0;transition:opacity 1.2s ease 1.2s;text-align:center}
.introp .mark.on .sub{opacity:1}
.introp .skip{position:absolute;right:var(--gutter);bottom:calc(28px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--silver);opacity:.7}
.introp .skip:hover{opacity:1}
body.introview #nav,body.introview footer{display:none}
.logo{border-radius:50%;overflow:hidden;background:var(--navy);flex:none}
.logo img{width:100%;height:100%;transform:scale(1.06);object-fit:cover}

/* nav */
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--gutter);background:rgba(2,19,49,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft);transition:background .3s}
#nav.scrolled{background:rgba(2,19,49,.82)}
#nav .brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;letter-spacing:.34em;font-size:15px;padding-left:.1em}
#nav .brand .logo{width:34px;height:34px}
#nav .links{display:flex;gap:28px;font-family:var(--mono);font-size:11px;letter-spacing:.18em}
#nav .links a{padding:6px 0;border-bottom:1px solid transparent;opacity:.85}
#nav .links a:hover,#nav .links a.on{opacity:1;border-color:var(--silver)}
#nav .icons{display:flex;gap:6px;align-items:center}
#nav .icons button,#nav .icons a{width:40px;height:40px;display:grid;place-items:center;border-radius:2px;position:relative}
#nav .icons button:hover{background:rgba(255,255,255,.06)}
#nav .icons svg{width:20px;height:20px;stroke:var(--white);fill:none;stroke-width:1.5}
#mute[aria-pressed="true"] svg{stroke:var(--silver)}
.badge{position:absolute;top:4px;right:2px;background:var(--blue);color:#fff;font:500 10px var(--mono);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#nav .icons #burger{display:none}
#mnav{display:none;position:fixed;inset:0;z-index:40;background:rgba(1,19,49,.96);padding:calc(24px + env(safe-area-inset-top,0px)) var(--gutter) 40px;flex-direction:column;gap:6px}
#mnav.open{display:flex}
#mnav a{font-family:var(--display);font-size:30px;letter-spacing:.14em;padding:12px 0;border-bottom:1px solid var(--line-soft)}
#mnav .close{align-self:flex-end;font-family:var(--mono);font-size:12px;letter-spacing:.2em;padding:8px 0 18px}
@media(max-width:900px){#nav .links{display:none}#nav .icons #burger{display:grid}}
@media(max-width:520px){#nav .icons a[href="#account"],#nav .icons #wbtn{display:none}#nav .brand{letter-spacing:.22em;font-size:13px}#nav .icons button{width:36px}}

/* page */
#app{position:relative;z-index:1;min-height:70vh;overflow-x:clip}
.page{animation:pagein .55s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{padding-inline:var(--gutter);max-width:1380px;margin:0 auto}
.section{padding-block:clamp(44px,7vw,96px)}
.rule{height:1px;background:var(--line-soft)}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.head .eyebrow{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 26px;border:1px solid var(--silver);border-radius:2px;min-height:48px;transition:background .25s,border-color .25s,transform .15s;position:relative}
.btn:hover{background:rgba(255,255,255,.06)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-soft);border-color:var(--blue-soft)}
.btn.small{padding:10px 16px;min-height:40px;font-size:11px}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;align-content:center;padding-block:clamp(36px,5vw,72px);position:relative}
.herogrid{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(24px,4vw,60px);align-items:center;position:relative;z-index:1}
.herotext{min-width:0}
.herostar{border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;background:var(--panel);display:grid;transition:transform .35s,border-color .35s,box-shadow .35s;min-width:0}
.herostar:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 26px 54px -28px rgba(14,115,179,.55)}
.herostar .pic{position:relative;aspect-ratio:16/11;overflow:hidden;background:linear-gradient(160deg,#052a57,#011a36)}
.herostar .pic .ph{width:100%;height:100%;object-fit:cover}
.herostar:hover .pic .ph{transform:scale(1.03)}
.herostar .flag{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;background:var(--blue);color:#fff;padding:5px 10px;border-radius:2px}
.herostar .info{padding:18px 20px 20px;display:grid;gap:8px}
.herostar .model{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--silver);display:flex;justify-content:space-between;gap:10px}
.herostar h3{font-size:clamp(18px,1.9vw,23px)}
.herostar p{font-size:13px;color:var(--fg-dim)}
.herostar .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;border-top:1px solid var(--line-soft);padding-top:12px}
.herostar .price{font-family:var(--display);font-size:21px}
.herostar .go{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--silver)}
@media(max-width:860px){.herogrid{grid-template-columns:1fr}.herostar{max-width:560px}}
.hero .eyebrow{margin-bottom:22px}
.hero p.lead{font-size:clamp(15px,1.5vw,19px);color:var(--fg-dim);max-width:46ch;margin:20px 0 30px;font-weight:300}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.sells{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.sells a{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line-soft);border-radius:999px;padding:7px 13px;color:var(--fg-dim);transition:border-color .2s,color .2s}
.sells a:hover{border-color:var(--silver);color:var(--fg)}
.hero>*{position:relative;z-index:1}.hero .planet{position:absolute;z-index:0;right:calc(-1 * var(--gutter));bottom:-26%;opacity:.4;width:min(40vw,460px);aspect-ratio:1;max-width:100%;pointer-events:none;opacity:.9}
.ticker{display:flex;gap:40px;overflow:hidden;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--silver);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:12px 0;white-space:nowrap;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ticker span{flex:none}
@media(max-width:700px){.hero .planet{width:70vw;right:-20vw;bottom:-6%;opacity:.55}}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{grid-column:span 2;min-height:300px;position:relative;border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;background:var(--panel);display:flex;flex-direction:column;justify-content:end;padding:22px;transition:transform .3s,border-color .3s}
.cat{min-height:320px}
.cat:hover{transform:translateY(-4px);border-color:var(--line)}
.cat .art{position:absolute;inset:0;opacity:.9}
.cat .art svg{width:100%;height:100%}
.cat .t{position:relative;display:grid;gap:8px}
.cat h3{font-size:clamp(20px,2.2vw,28px);text-transform:uppercase;letter-spacing:.08em}
.cat p{color:var(--fg-dim);font-size:13px;max-width:36ch}
@media(max-width:900px){.cats{grid-template-columns:1fr 1fr}.cat{grid-column:span 1;min-height:260px}}
@media(max-width:560px){.cats{grid-template-columns:1fr}}

/* product grid + card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel);display:flex;flex-direction:column;min-width:0;transition:transform .3s,border-color .3s,box-shadow .3s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 20px 40px -24px rgba(14,115,179,.5)}
.card .pic{aspect-ratio:1;background:linear-gradient(160deg,#052a57,#011a36);border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden}
.card .pic svg{width:100%;height:100%}
.card .tag{position:absolute;bottom:10px;left:10px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--silver);background:rgba(1,19,49,.75);padding:4px 7px;border:1px solid var(--line-soft);border-radius:2px}
.card .wish{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:2px;background:rgba(1,19,49,.6)}
.card .wish svg{width:16px;height:16px;fill:none;stroke:var(--silver);stroke-width:1.6}
.card .wish.on svg{fill:var(--blue);stroke:var(--blue)}
.card .body{padding:14px 16px 16px;display:grid;gap:7px}
.card .model{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--silver);display:flex;justify-content:space-between;gap:8px}
.card h3{font-size:17px;letter-spacing:.02em}
.card .desc{font-size:12.5px;color:var(--fg-dim);min-height:2.7em}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card .price{font-family:var(--display);font-size:18px;font-weight:500}
.avail{font-family:var(--mono);font-size:10px;letter-spacing:.14em;display:inline-flex;align-items:center;gap:6px}
.avail::before{content:"";width:6px;height:6px;border-radius:50%;background:#5BBF8A}
.avail.low::before{background:#D9B35B}
.avail.out::before{background:var(--silver-dim)}
.card .specs{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--silver);letter-spacing:.06em;border-top:1px solid var(--line-soft);padding-top:9px;margin-top:4px}
.card .add{margin-top:8px}

/* shop filters */
.shop{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:start}
.filters{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:22px;border:1px solid var(--line-soft);padding:20px;border-radius:var(--radius);background:var(--panel)}
.filters h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--silver);text-transform:uppercase;margin-bottom:8px}
.filters label{display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.filters input[type=checkbox],.filters input[type=radio]{accent-color:var(--blue);width:15px;height:15px;margin:0}
.filters input[type=range]{width:100%;accent-color:var(--blue)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silver)}
select,input[type=text],input[type=email],input[type=tel],input[type=search],input[type=number],textarea{font:inherit;color:var(--fg);background:rgba(1,19,49,.6);border:1px solid var(--line);border-radius:2px;padding:11px 12px;min-height:44px;width:100%}
select{appearance:auto}
.toolbar select{width:auto;min-height:38px;padding:7px 10px;font-family:var(--mono);font-size:11px}
#ftoggle{display:none}
@media(max-width:900px){.shop{grid-template-columns:1fr}.filters{position:static;display:none}.filters.open{display:grid}#ftoggle{display:inline-flex}}

/* product page */
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,64px);align-items:start}
.gallery{display:grid;gap:10px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.gallery .main{aspect-ratio:1;border:1px solid var(--line-soft);border-radius:var(--radius);background:linear-gradient(160deg,#052a57,#011a36);overflow:hidden;position:relative}
.gallery .main svg{width:100%;height:100%;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.gallery .main .id{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--silver)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs button{aspect-ratio:1;border:1px solid var(--line-soft);border-radius:var(--radius);background:linear-gradient(160deg,#052a57,#011a36);overflow:hidden;padding:0}
.thumbs button.on{border-color:var(--blue-soft)}
.thumbs svg{width:100%;height:100%}
.buy{display:grid;gap:18px}
.buy h1{font-size:clamp(28px,3.6vw,46px);letter-spacing:.03em}
.buy .price{font-family:var(--display);font-size:30px;font-weight:500}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:2px;height:48px}
.qty button{width:46px;font-size:18px}
.qty input{width:52px;text-align:center;border:0;border-inline:1px solid var(--line);background:transparent;min-height:0;padding:0;font-family:var(--mono)}
.buyrow{display:flex;gap:12px;flex-wrap:wrap}
.buyrow .btn.primary{flex:1;min-width:200px}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec th,.spec td{text-align:left;padding:10px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.spec th{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;color:var(--silver);width:42%;text-transform:uppercase}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;letter-spacing:.18em}
.tabs button{padding:12px 0;border-bottom:1px solid transparent;color:var(--silver)}
.tabs button.on{color:var(--fg);border-color:var(--silver)}
.tabpane{padding-top:18px;display:grid;gap:14px;font-size:14px;color:var(--fg-dim);max-width:62ch}
.tabpane[hidden]{display:none}
.notice{border:1px solid var(--line);border-left:3px solid var(--silver);padding:14px 16px;font-size:13px;color:var(--fg-dim);display:grid;gap:6px;border-radius:2px}
.notice b{color:var(--fg);font-weight:500}
.crumbs{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--silver);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.crumbs a:hover{color:var(--fg)}
.markings{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--silver);border-top:1px solid var(--line-soft);padding-top:12px}
@media(max-width:900px){.pdp{grid-template-columns:1fr}.gallery{position:static}}

/* missions */
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel);padding:24px;display:grid;gap:14px;transition:transform .3s,border-color .3s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-4px);border-color:var(--line)}
.mcard .ins{width:84px;height:84px}
.mcard h3{text-transform:uppercase;letter-spacing:.1em;font-size:22px}
.mcard .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--silver);display:grid;gap:4px}
.mcard p{font-size:13px;color:var(--fg-dim)}
.mcard::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid var(--accent,var(--line));opacity:.35}
.mhero{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding-block:40px}
.mhero .ins{width:min(40vw,200px);height:min(40vw,200px)}
.mhero p{max-width:60ch;color:var(--fg-dim);font-size:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.kv div{border:1px solid var(--line-soft);padding:12px 14px;border-radius:2px}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--silver);margin-bottom:4px}
@media(max-width:700px){.mhero{grid-template-columns:1fr}}

/* about */
.divs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.div{border:1px solid var(--line-soft);padding:20px;border-radius:2px;background:var(--panel);display:grid;gap:8px}
.div .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--silver)}
.div h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.div p{font-size:13px;color:var(--fg-dim)}
.prose{max-width:64ch;display:grid;gap:18px;font-size:16px;color:var(--fg-dim);font-weight:300}
.prose strong{color:var(--fg);font-weight:500}

/* light surface: cart, checkout, account */
.light{background:var(--white);color:#0B1E36;--fg:#0B1E36;--fg-dim:#4A5A6E;--line:rgba(1,39,78,.22);--line-soft:rgba(1,39,78,.1);--silver:#5C6B7E;--panel:#fff;color-scheme:light;border-top:1px solid rgba(255,255,255,.1)}
.light .btn{border-color:#0B1E36}
.light .btn:hover{background:rgba(1,39,78,.05)}
.light select,.light input,.light textarea{background:#fff;color:#0B1E36;border-color:var(--line)}
.light .card .pic,.light .lineitem .pic{background:linear-gradient(160deg,#052a57,#011a36)}
.cartgrid{display:grid;grid-template-columns:1.4fr .8fr;gap:40px;align-items:start}
